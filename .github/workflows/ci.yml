name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      repo: ${{ steps.scope.outputs.repo }}
      terraform: ${{ steps.scope.outputs.terraform }}
      node: ${{ steps.scope.outputs.node }}
      database: ${{ steps.scope.outputs.database }}
      browser: ${{ steps.scope.outputs.browser }}
      desktop: ${{ steps.scope.outputs.desktop }}
      containers: ${{ steps.scope.outputs.containers }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      changed_packages: ${{ steps.scope.outputs.changed_packages }}
      scope_json: ${{ steps.scope.outputs.scope_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify affected validation scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          scope_json="$RUNNER_TEMP/ci-scope.json"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" > "$changed_files"; then
              echo "Unable to calculate the pull-request diff; selecting full CI." >&2
              : > "$changed_files"
            fi
          else
            : > "$changed_files"
          fi
          node .github/scripts/ci-scope.mjs \
            --files "$changed_files" \
            --json \
            --github-output "$GITHUB_OUTPUT" | tee "$scope_json"
          {
            echo "## CI scope (shadow mode)"
            echo '```json'
            cat "$scope_json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  quality:
    name: Quality and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-os/web build
      - name: Compile native overlay
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --no-bundle
