name: Release desktop installers

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Serialize version reservation, packaging and publication for verified main.
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      build: ${{ steps.auto.outputs.build }}
      tag: ${{ steps.auto.outputs.tag }}
      ref: ${{ steps.auto.outputs.ref }}
      source: ${{ steps.auto.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reserve a release for desktop changes on verified main
        id: auto
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node apps/desktop/scripts/automatic-release.mjs
  macos:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    timeout-minutes: 60
    environment: desktop-signing
    name: macOS DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate source versions
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          release_tag="$RELEASE_TAG"
          node apps/desktop/scripts/release-metadata.mjs "$release_tag"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-os/web build
        env:
          VITE_API_BASE_URL: ${{ vars.PERSONAL_OS_API_BASE_URL }}
      - name: Require signing and production API configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_API_BASE_URL: ${{ vars.PERSONAL_OS_API_BASE_URL }}
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
      - name: Build signed and notarized app, widgets, and DMG
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_API_BASE_URL: ${{ vars.PERSONAL_OS_API_BASE_URL }}
          ILO_HOST_PROFILE_BASE64: ${{ secrets.ILO_HOST_PROFILE_BASE64 }}
          ILO_WIDGET_PROFILE_BASE64: ${{ secrets.ILO_WIDGET_PROFILE_BASE64 }}
          NOHMI_UPDATER_PUBLIC_KEY: ${{ vars.NOHMI_UPDATER_PUBLIC_KEY }}
          ILO_KEYCHAIN_ACCESS_GROUP: ${{ vars.ILO_KEYCHAIN_ACCESS_GROUP }}
        run: bash macos/scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer-${{ matrix.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*

  publish:
    if: startsWith(needs.prepare.outputs.tag, 'v')
    permissions:
      contents: write
    needs: [prepare, macos]
    timeout-minutes: 280
    runs-on: ubuntu-latest
    environment: desktop-updater-signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: macos-installer-*
          merge-multiple: true
      - name: Prepare the pinned signer without application dependencies
        run: npm install --prefix "$RUNNER_TEMP/nohmi-signer" --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.12.0
      - name: Sign only the final notarized updater archives
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for arch in aarch64 x86_64; do
            archive="$GITHUB_WORKSPACE/release-assets/nohmi_${RELEASE_TAG#v}_${arch}.app.tar.gz"
            test -f "$archive"
            "$RUNNER_TEMP/nohmi-signer/node_modules/.bin/tauri" signer sign --app-version "${RELEASE_TAG#v}" "$archive"
          done
      - name: Assemble and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source }}
          AUTO_PUBLISH_ENABLED: ${{ vars.NOHMI_DESKTOP_AUTO_PUBLISH }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        run: node apps/desktop/scripts/publish-release.mjs
