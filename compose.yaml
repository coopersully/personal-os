name: personal-os

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: personal_os
      POSTGRES_PASSWORD: personal_os
      POSTGRES_USER: personal_os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_os -d personal_os"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,tauri://localhost,http://tauri.localhost}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8787}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a base64-encoded 32-byte key}
      DATABASE_URL: postgres://personal_os:personal_os@postgres:5432/personal_os
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8787/v1/connectors/google/callback}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:8788/mcp}
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:?Set MCP_INTERNAL_SECRET to a random shared secret}
      OAUTH_AUTHORIZATION_SERVER_URL: ${API_BASE_URL:-http://localhost:8787}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-http://localhost:8787/v1/x-bookmarks/callback}
      PORT: 8787
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SESSION_COOKIE_NAME: personal_os_session
      SESSION_TTL_DAYS: 30
      TRUST_PROXY: ${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - "8787:8787"

  mcp:
    build:
      context: .
      target: mcp
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PERSONAL_OS_API_URL: http://api:8787
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_RATE_LIMIT_MAX_REQUESTS: ${MCP_RATE_LIMIT_MAX_REQUESTS:-120}
      MCP_RATE_LIMIT_WINDOW_SECONDS: ${MCP_RATE_LIMIT_WINDOW_SECONDS:-60}
      MCP_TRUST_PROXY: ${MCP_TRUST_PROXY:-false}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8788}
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:?Set MCP_INTERNAL_SECRET to a random shared secret}
      PORT: 8788
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - "8788:8788"

  web:
    build:
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8787}
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
