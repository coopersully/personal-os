name: Product proposal
description: Propose a bounded improvement to Personal OS
title: "Proposal: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the product outcome rather than an implementation assignment. This repository is
        public, so use fictional examples and omit personal information, credentials, provider
        payloads, private content, and maintainer-only workflow details.

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a person be able to accomplish when this is complete?
      placeholder: A person can…
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: What is difficult, unreliable, or impossible today?
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: Proposed experience
      description: Describe the smallest coherent user-facing behavior, including important states.
      placeholder: Include success, empty, loading, denied, unavailable, or recovery states when relevant.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance signals
      description: List observable results that would demonstrate the outcome is delivered.
      placeholder: |
        - [ ] A person can…
        - [ ] When the dependency is unavailable…
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Note privacy, compatibility, rollout, or scope boundaries that matter.

  - type: checkboxes
    id: safety
    attributes:
      label: Public repository safety
      options:
        - label: I used only public-safe context and fictional examples.
          required: true
