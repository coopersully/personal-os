<!-- Adapted from Design System & Branding: figure-grain.svg, three ordered Bayer phases; same quantization and timing, luminosity-composited to retain category colors. -->
<svg xmlns="http://www.w3.org/2000/svg"><defs><filter id="grain-a" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feColorMatrix in="SourceGraphic" type="saturate" values="0" result="luminance"/>
<feImage href="data:image/svg+xml;base64," x="0" y="0" width="4" height="4" result="matrix"/>
<feTile in="matrix" result="threshold"/><feComponentTransfer in="luminance" result="lifted"><feFuncR type="linear" slope="1" intercept="0.3"/><feFuncG type="linear" slope="1" intercept="0.3"/><feFuncB type="linear" slope="1" intercept="0.3"/></feComponentTransfer>
<feComposite in="lifted" in2="threshold" operator="arithmetic" k2="1" k3="0.32" k4="-0.16" result="ordered"/>
<feComponentTransfer in="ordered" result="quantized"><feFuncR type="discrete" tableValues="0 0.33 0.67 1"/><feFuncG type="discrete" tableValues="0 0.33 0.67 1"/><feFuncB type="discrete" tableValues="0 0.33 0.67 1"/></feComponentTransfer>
<feBlend in="quantized" in2="SourceGraphic" mode="luminosity" result="colored"/><feComposite in="colored" in2="SourceAlpha" operator="in"/>
</filter><filter id="grain-b" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feColorMatrix in="SourceGraphic" type="saturate" values="0" result="luminance"/>
<feImage href="data:image/svg+xml;base64," x="0" y="0" width="4" height="4" result="matrix"/>
<feTile in="matrix" result="threshold"/><feComponentTransfer in="luminance" result="lifted"><feFuncR type="linear" slope="1" intercept="0.3"/><feFuncG type="linear" slope="1" intercept="0.3"/><feFuncB type="linear" slope="1" intercept="0.3"/></feComponentTransfer>
<feComposite in="lifted" in2="threshold" operator="arithmetic" k2="1" k3="0.32" k4="-0.16" result="ordered"/>
<feComponentTransfer in="ordered" result="quantized"><feFuncR type="discrete" tableValues="0 0.33 0.67 1"/><feFuncG type="discrete" tableValues="0 0.33 0.67 1"/><feFuncB type="discrete" tableValues="0 0.33 0.67 1"/></feComponentTransfer>
<feBlend in="quantized" in2="SourceGraphic" mode="luminosity" result="colored"/><feComposite in="colored" in2="SourceAlpha" operator="in"/>
</filter><filter id="grain-c" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feColorMatrix in="SourceGraphic" type="saturate" values="0" result="luminance"/>
<feImage href="data:image/svg+xml;base64," x="0" y="0" width="4" height="4" result="matrix"/>
<feTile in="matrix" result="threshold"/><feComponentTransfer in="luminance" result="lifted"><feFuncR type="linear" slope="1" intercept="0.3"/><feFuncG type="linear" slope="1" intercept="0.3"/><feFuncB type="linear" slope="1" intercept="0.3"/></feComponentTransfer>
<feComposite in="lifted" in2="threshold" operator="arithmetic" k2="1" k3="0.32" k4="-0.16" result="ordered"/>
<feComponentTransfer in="ordered" result="quantized"><feFuncR type="discrete" tableValues="0 0.33 0.67 1"/><feFuncG type="discrete" tableValues="0 0.33 0.67 1"/><feFuncB type="discrete" tableValues="0 0.33 0.67 1"/></feComponentTransfer>
<feBlend in="quantized" in2="SourceGraphic" mode="luminosity" result="colored"/><feComposite in="colored" in2="SourceAlpha" operator="in"/>
</filter></defs></svg>
