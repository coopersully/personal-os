name: Deploy hosted application

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  statuses: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  announce:
    name: Mark production deployment pending
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Select release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish pending commit status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            -f state=pending \
            -f context=production/ilo \
            -f description="Production deployment is queued" \
            -f target_url="$RUN_URL"

  deploy:
    name: Deploy production
    needs: announce
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      APP_URL: ${{ vars.APP_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      MCP_ECR_REPOSITORY: ${{ vars.MCP_ECR_REPOSITORY }}
      MCP_SERVICE: ${{ vars.MCP_SERVICE }}
      MCP_URL: ${{ vars.MCP_URL }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
    steps:
      - name: Require production deployment configuration
        run: |
          for variable in \
            API_ECR_REPOSITORY API_SERVICE API_URL APP_URL AWS_REGION \
            AWS_ROLE_ARN ECS_CLUSTER MCP_ECR_REPOSITORY MCP_SERVICE MCP_URL \
            WEB_BUCKET WEB_DISTRIBUTION_ID
          do
            test -n "${!variable}" || {
              echo "::error::Missing GitHub production variable: ${variable}"
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.announce.outputs.release_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Select immutable release tag
        id: release
        env:
          HEAD_SHA: ${{ needs.announce.outputs.release_sha }}
        run: echo "tag=sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API and MCP images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            --target api \
            --tag "${API_ECR_REPOSITORY}:${RELEASE_TAG}" \
            .
          docker build \
            --platform linux/amd64 \
            --target mcp \
            --tag "${MCP_ECR_REPOSITORY}:${RELEASE_TAG}" \
            .
          docker push "${API_ECR_REPOSITORY}:${RELEASE_TAG}"
          docker push "${MCP_ECR_REPOSITORY}:${RELEASE_TAG}"

      - name: Reject vulnerable container images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          check_image() {
            local repository_url="$1"
            local repository_name="${repository_url##*/}"
            local findings
            local scan_status
            local critical
            local high

            # A scan-on-push result is not always registered by the time the
            # push command returns. The AWS waiter treats that short
            # ScanNotFound window as terminal, so poll until ECR exposes a
            # completed result instead.
            for attempt in {1..30}; do
              if findings="$(
                aws ecr describe-image-scan-findings \
                  --repository-name "$repository_name" \
                  --image-id imageTag="$RELEASE_TAG" \
                  --output json 2>/dev/null
              )"; then
                scan_status="$(
                  jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$findings"
                )"
                if [ "$scan_status" = "COMPLETE" ]; then
                  break
                fi
                if [ "$scan_status" = "FAILED" ]; then
                  echo "${repository_name}: image scan failed" >&2
                  return 1
                fi
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "${repository_name}: image scan did not complete" >&2
                return 1
              fi
              sleep 10
            done
            critical="$(
              jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' \
                <<<"$findings"
            )"
            high="$(
              jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' \
                <<<"$findings"
            )"
            echo "${repository_name}: ${critical} critical, ${high} high"
            test "$critical" -eq 0
            test "$high" -eq 0
          }

          check_image "$API_ECR_REPOSITORY"
          check_image "$MCP_ECR_REPOSITORY"

      - run: pnpm install --frozen-lockfile

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
        run: pnpm --filter @personal-os/web build

      - name: Register immutable task definitions
        id: tasks
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          register_task() {
            local family="$1"
            local container="$2"
            local image="$3"
            local output_name="$4"
            local task_file
            local registered_arn
            task_file="$(mktemp)"

            aws ecs describe-task-definition \
              --task-definition "$family" \
              --output json |
              jq \
                --arg container "$container" \
                --arg image "$image" \
                '.taskDefinition
                | .containerDefinitions |= map(
                    if .name == $container then .image = $image else . end
                  )
                | del(
                    .compatibilities,
                    .registeredAt,
                    .registeredBy,
                    .requiresAttributes,
                    .revision,
                    .status,
                    .taskDefinitionArn
                  )' > "$task_file"

            registered_arn="$(
              aws ecs register-task-definition \
                --cli-input-json "file://${task_file}" \
                --query taskDefinition.taskDefinitionArn \
                --output text
            )"
            echo "${output_name}=${registered_arn}" >> "$GITHUB_OUTPUT"
          }

          register_task \
            "$API_SERVICE" \
            api \
            "${API_ECR_REPOSITORY}:${RELEASE_TAG}" \
            api_task_definition
          register_task \
            "$MCP_SERVICE" \
            mcp \
            "${MCP_ECR_REPOSITORY}:${RELEASE_TAG}" \
            mcp_task_definition

      - name: Deploy migration-capable API serially
        env:
          API_TASK_DEFINITION: ${{ steps.tasks.outputs.api_task_definition }}
        run: |
          api_scaling_resource="service/${ECS_CLUSTER}/${API_SERVICE}"
          api_drain_started=false

          fail_closed_api_deployment() {
            deployment_exit_code="$?"
            trap - ERR
            if test "$api_drain_started" = "true"; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER" \
                --service "$API_SERVICE" \
                --desired-count 0 \
                >/dev/null ||
                true
              aws ecs wait services-stable \
                --cluster "$ECS_CLUSTER" \
                --services "$API_SERVICE" ||
                true
              api_failure_counts="$(
                aws ecs describe-services \
                  --cluster "$ECS_CLUSTER" \
                  --services "$API_SERVICE" \
                  --query 'services[0].[desiredCount,runningCount,pendingCount]' \
                  --output text 2>/dev/null ||
                  true
              )"
              if test "$api_failure_counts" != $'0\t0\t0'; then
                echo "::error::Fail-closed recovery could not prove desired/running/pending zero: ${api_failure_counts:-unavailable}"
              fi
              echo "::error::The API rollout failed after drain began; the service was stopped and scaling remains suspended."
            fi
            exit "$deployment_exit_code"
          }

          # Prove list authority before changing scaling or desired count. The
          # exact result is captured again after scaling is suspended.
          aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$API_SERVICE" \
            --desired-status RUNNING \
            --query taskArns \
            --output json \
            >/dev/null

          api_service_before="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE" \
              --output json
          )"
          api_before_counts="$(
            jq -r '.services[0] | [.desiredCount, .runningCount, .pendingCount] | @tsv' \
              <<<"$api_service_before"
          )"
          api_before_desired="$(cut -f1 <<<"$api_before_counts")"
          api_before_running="$(cut -f2 <<<"$api_before_counts")"
          api_before_pending="$(cut -f3 <<<"$api_before_counts")"
          if ! {
            test "$api_before_pending" = "0" &&
              test "$api_before_desired" = "$api_before_running"
          }; then
            echo "::error::The API service must be stable before drain: ${api_before_counts}"
            exit 1
          fi
          api_minimum_healthy_percent="$(
            jq -r '.services[0].deploymentConfiguration.minimumHealthyPercent' \
              <<<"$api_service_before"
          )"
          api_maximum_percent="$(
            jq -r '.services[0].deploymentConfiguration.maximumPercent' \
              <<<"$api_service_before"
          )"
          api_breaker_enable="$(
            jq -r '.services[0].deploymentConfiguration.deploymentCircuitBreaker.enable' \
              <<<"$api_service_before"
          )"
          api_breaker_rollback="$(
            jq -r '.services[0].deploymentConfiguration.deploymentCircuitBreaker.rollback' \
              <<<"$api_service_before"
          )"
          if ! {
            test "$api_breaker_enable" = "true" &&
              test "$api_breaker_rollback" = "true"
          }; then
            echo "::error::The API circuit breaker does not match the required IaC state."
            exit 1
          fi
          api_breaker_disabled_configuration="$(
            jq -nc \
              --argjson minimum "$api_minimum_healthy_percent" \
              --argjson maximum "$api_maximum_percent" \
              '{
                minimumHealthyPercent: $minimum,
                maximumPercent: $maximum,
                deploymentCircuitBreaker: {enable: true, rollback: false}
              }'
          )"
          api_iac_deployment_configuration="$(
            jq -nc \
              --argjson minimum "$api_minimum_healthy_percent" \
              --argjson maximum "$api_maximum_percent" \
              '{
                minimumHealthyPercent: $minimum,
                maximumPercent: $maximum,
                deploymentCircuitBreaker: {enable: true, rollback: true}
              }'
          )"

          # Stop and drain the old binary before the new task runs migrations.
          # Connector lifecycle migrations invalidate cached authority and cannot
          # safely coexist with a pre-fence process that is still in provider I/O.
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id "$api_scaling_resource" \
            --scalable-dimension ecs:service:DesiredCount \
            --suspended-state \
              DynamicScalingInSuspended=true,DynamicScalingOutSuspended=true,ScheduledScalingSuspended=true \
            >/dev/null
          api_drain_started=true
          trap fail_closed_api_deployment ERR

          api_pre_drain_task_arns="$(
            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$API_SERVICE" \
              --desired-status RUNNING \
              --query taskArns \
              --output json
          )"
          api_pre_drain_task_count="$(jq -r 'length' <<<"$api_pre_drain_task_arns")"
          if test "$api_pre_drain_task_count" != "$api_before_running"; then
            echo "::error::Exact pre-drain task capture did not match the stable running count."
            false
          fi
          if test "$api_pre_drain_task_count" -gt 100; then
            echo "::error::Exact drain validation supports at most 100 API tasks per deployment."
            false
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" \
            --desired-count 0 \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE"
          api_counts="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE" \
              --query 'services[0].[desiredCount,runningCount,pendingCount]' \
              --output text
          )"
          test "$api_counts" = $'0\t0\t0' || {
            echo "::error::The old API service did not drain completely: ${api_counts}"
            false
          }

          if test "$api_pre_drain_task_count" -gt 0; then
            readarray -t api_pre_drain_tasks < <(jq -r '.[]' <<<"$api_pre_drain_task_arns")
            api_stopped_tasks="$(
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks "${api_pre_drain_tasks[@]}" \
                --output json
            )"
            if ! jq -e \
              --argjson expected "$api_pre_drain_task_count" \
              '
                (.failures | length) == 0 and
                (.tasks | length) == $expected and
                all(
                  .tasks[];
                  .lastStatus == "STOPPED" and
                  ([.containers[] | select(.name == "api")] | length) == 1 and
                  ([.containers[] | select(.name == "api")][0] |
                    .lastStatus == "STOPPED" and
                    .exitCode == 0 and
                    ((.reason // "") | test("kill|timeout"; "i") | not)
                  ) and
                  ((.stoppedReason // "") | test("kill|timeout"; "i") | not)
                )
              ' \
              <<<"$api_stopped_tasks" \
              >/dev/null; then
              echo "::error::At least one exact pre-drain API task lacks a successful essential-container exit."
              false
            fi
          fi

          # Rollback to the last completed (old) deployment is unsafe after
          # migrations. Keep the circuit breaker enabled, but rollback disabled,
          # until the exact new primary has completed and remained healthy.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" \
            --deployment-configuration "$api_breaker_disabled_configuration" \
            >/dev/null
          api_disabled_breaker="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE" \
              --query 'services[0].deploymentConfiguration.deploymentCircuitBreaker.[enable,rollback]' \
              --output text
          )"
          if test "$api_disabled_breaker" != $'True\tFalse'; then
            echo "::error::Could not prove circuit-breaker rollback is disabled before migration startup."
            false
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" \
            --task-definition "$API_TASK_DEFINITION" \
            --desired-count 1 \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE"
          api_service_state="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE" \
              --output json
          )"
          api_primary_count="$(
            jq -r '[.services[0].deployments[] | select(.status == "PRIMARY")] | length' \
              <<<"$api_service_state"
          )"
          api_primary_task="$(
            jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' \
              <<<"$api_service_state"
          )"
          api_primary_rollout="$(
            jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState' \
              <<<"$api_service_state"
          )"
          if ! {
            test "$api_primary_count" = "1" &&
              test "$api_primary_task" = "$API_TASK_DEFINITION" &&
              test "$api_primary_rollout" = "COMPLETED"
          }; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$API_SERVICE" \
              --desired-count 0 \
              >/dev/null
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE"
            echo "::error::The new API task did not remain the sole completed primary deployment; the service was stopped and scaling remains suspended."
            false
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" \
            --deployment-configuration "$api_iac_deployment_configuration" \
            >/dev/null
          api_restored_configuration="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$API_SERVICE" \
              --output json
          )"
          if ! jq -e \
            --argjson minimum "$api_minimum_healthy_percent" \
            --argjson maximum "$api_maximum_percent" \
            '
              .services[0].deploymentConfiguration |
              .minimumHealthyPercent == $minimum and
              .maximumPercent == $maximum and
              .deploymentCircuitBreaker.enable == true and
              .deploymentCircuitBreaker.rollback == true
            ' \
            <<<"$api_restored_configuration" \
            >/dev/null; then
            echo "::error::The healthy API service did not restore the declared circuit-breaker configuration."
            false
          fi

          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id "$api_scaling_resource" \
            --scalable-dimension ecs:service:DesiredCount \
            --suspended-state \
              DynamicScalingInSuspended=false,DynamicScalingOutSuspended=false,ScheduledScalingSuspended=false \
            >/dev/null
          trap - ERR

      - name: Deploy MCP after the API is healthy
        env:
          MCP_TASK_DEFINITION: ${{ steps.tasks.outputs.mcp_task_definition }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$MCP_SERVICE" \
            --task-definition "$MCP_TASK_DEFINITION" \
            --desired-count 1 \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$MCP_SERVICE"

      - name: Publish web assets
        run: |
          aws s3 sync \
            apps/web/dist/assets \
            "s3://${WEB_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete
          aws s3 sync \
            apps/web/dist \
            "s3://${WEB_BUCKET}" \
            --cache-control "no-cache" \
            --delete \
            --exclude "assets/*"
          invalidation_id="$(
            aws cloudfront create-invalidation \
              --distribution-id "$WEB_DISTRIBUTION_ID" \
              --paths "/*" \
              --query Invalidation.Id \
              --output text
          )"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$WEB_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify public health
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
            "${API_URL}/health/ready"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
            "${MCP_URL%/mcp}/health/live"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
            "$APP_URL"

  report:
    name: Report production deployment
    needs: [announce, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine deployment outcome
        id: outcome
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" && "$CI_CONCLUSION" != "success" ]]; then
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=CI failed; production was not deployed" >> "$GITHUB_OUTPUT"
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Production deployment succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Production deployment failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish final commit status
        env:
          DESCRIPTION: ${{ steps.outcome.outputs.description }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.announce.outputs.release_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.outcome.outputs.state }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            -f state="$STATE" \
            -f context=production/ilo \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
          {
            echo "## ilo production"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Result: **${STATE}**"
            echo "- Detail: ${DESCRIPTION}"
            echo "- Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or resolve the production incident
        continue-on-error: true
        env:
          DESCRIPTION: ${{ steps.outcome.outputs.description }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.announce.outputs.release_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.outcome.outputs.state }}
        run: |
          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Production deployment is failing" in:title' \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ "$STATE" == "success" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body "Recovered with \`${RELEASE_SHA}\`. ${RUN_URL}"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "${DESCRIPTION} for \`${RELEASE_SHA}\`. ${RUN_URL}"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Production deployment is failing" \
              --body "${DESCRIPTION} for \`${RELEASE_SHA}\`.

          Workflow: ${RUN_URL}"
          fi

      - name: Preserve the failed workflow conclusion
        if: steps.outcome.outputs.state != 'success'
        run: exit 1
