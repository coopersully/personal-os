name: PR metadata

# The source run reports `CI required` itself when it finishes (the last job of
# ci.yml). This workflow re-validates the Work map when the description is edited,
# without rerunning source tests. Both report the same protected context.
# The job must never be skipped: branch protection treats a skipped required job as
# passing. Keep every condition inside the script.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require successful source verification for this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_RETARGETED: ${{ github.event.action == 'edited' && github.event.changes.base != null }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          PR_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node .github/scripts/wait-source-ci.mjs
