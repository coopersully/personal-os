name: CI

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required_jobs: ${{ steps.scope.outputs.required_jobs }}
      lane: ${{ steps.scope.outputs.lane }}
      full: ${{ steps.scope.outputs.full }}
      repo: ${{ steps.scope.outputs.repo }}
      terraform: ${{ steps.scope.outputs.terraform }}
      node: ${{ steps.scope.outputs.node }}
      database: ${{ steps.scope.outputs.database }}
      browser: ${{ steps.scope.outputs.browser }}
      desktop: ${{ steps.scope.outputs.desktop }}
      containers: ${{ steps.scope.outputs.containers }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      changed_packages: ${{ steps.scope.outputs.changed_packages }}
      scope_json: ${{ steps.scope.outputs.scope_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify affected validation scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CI_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          # A draft runs the fast lane: the classifier omits the browser and desktop
          # matrices from required_jobs and the aggregate below reports nothing.
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope_json="$RUNNER_TEMP/ci-scope.json"
          scope_args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$EVENT_NAME" == "push" ]]; then
            scope_args=(--github-push)
          fi
          node .github/scripts/ci-scope.mjs \
            "${scope_args[@]}" \
            --json --github-output "$GITHUB_OUTPUT" | tee "$scope_json"
          {
            echo "## CI scope"
            echo '```json'
            cat "$scope_json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record source event and canonical scope
        if: github.event_name == 'pull_request'
        run: node .github/scripts/source-receipt.mjs "$RUNNER_TEMP/source-candidate.json"
      - name: Retain attempt-specific source receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: source-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Explain the draft fast lane
        if: steps.scope.outputs.lane == 'fast'
        run: |
          echo "::notice title=Draft fast lane::Browser and desktop acceptance are deferred and Source verification is not reported. Mark the pull request ready for review, or add the ci:full label and push, to run complete verification."

  infrastructure:
    name: Terraform
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'infrastructure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  repository:
    name: Repository contracts
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'repository') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm check:repo

  lint-and-format:
    name: Lint and format
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'lint-and-format') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Node quality is the canonical result for types, tests, coverage and builds. The
  # two jobs below are its inputs: it needs both, so their failure, cancellation or
  # absence skips it and fails the required gate.
  tests:
    name: Node tests (${{ matrix.shard }}/6)
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'quality') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - id: install
        run: pnpm install --frozen-lockfile
      # Each shard runs its share of the suite and exports raw V8 coverage without
      # converting it or checking coverage floors; Node quality merges every shard.
      - id: node
        env:
          NOHMI_COVERAGE_SHARD_DIR: ${{ runner.temp }}/coverage-shards/${{ matrix.shard }}
        run: pnpm test:coverage:shard --shard=${{ matrix.shard }}/6
        timeout-minutes: 15
      - name: Retain raw shard coverage for the merge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-shards/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Node build
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'quality') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - id: install
        run: pnpm install --frozen-lockfile
      - id: audit
        run: pnpm audit --prod
      - id: typecheck
        run: pnpm typecheck
        timeout-minutes: 5
      - id: build
        run: pnpm build
        timeout-minutes: 10

  quality:
    name: Node quality
    needs: [changes, tests, build]
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'quality') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - id: coverage-prepare
        name: Prepare attempt-bound coverage diagnostics
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/collect-node-coverage.mjs prepare "$RUNNER_TEMP/node-coverage"
      - id: install
        run: pnpm install --frozen-lockfile
      - id: shards
        name: Collect raw coverage from every shard of this attempt
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/coverage-shards
      # Merges raw V8 results before conversion, as a single run does, then writes the
      # reports and enforces the coverage floors for the whole suite.
      - id: node
        env:
          NOHMI_COVERAGE_SHARD_DIR: ${{ runner.temp }}/coverage-shards
        run: pnpm test:coverage:merge
        timeout-minutes: 10
      - id: coverage
        name: Collect bounded coverage diagnostics
        if: always()
        timeout-minutes: 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          # This job runs only after Node build succeeded as a whole.
          AUDIT_OUTCOME: ${{ needs.build.result }}
          TYPECHECK_OUTCOME: ${{ needs.build.result }}
          COVERAGE_OUTCOME: ${{ steps.node.outcome }}
          BUILD_OUTCOME: ${{ needs.build.result }}
        run: node .github/scripts/collect-node-coverage.mjs collect "$RUNNER_TEMP/node-coverage"
      - name: Retain attempt-bound Node coverage diagnostics
        if: ${{ always() && steps.coverage.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: node-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/node-coverage/manifest.json
            ${{ runner.temp }}/node-coverage/coverage-summary.json
            ${{ runner.temp }}/node-coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser acceptance (${{ matrix.project }}, ${{ matrix.shard }}/6)
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'browser') }}
    runs-on: ubuntu-latest
    # Leave setup/download headroom outside the bounded test execution.
    timeout-minutes: 50
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
      BROWSER_SHARD: ${{ matrix.shard }}
      BROWSER_DIAGNOSTIC_CONTEXT: local-e2e-fixtures
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - name: Prepare attempt-bound browser diagnostics
        run: node .github/scripts/collect-browser-diagnostics.mjs prepare "$RUNNER_TEMP/browser-diagnostics"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: |
          grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -f
          pnpm exec playwright install --with-deps chromium
      - id: browser_tests
        run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/6
        timeout-minutes: 30
      - id: browser_diagnostics
        name: Collect bounded browser diagnostics
        if: always()
        timeout-minutes: 1
        env:
          BROWSER_TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: node .github/scripts/collect-browser-diagnostics.mjs collect "$RUNNER_TEMP/browser-diagnostics"
      - name: Retain attempt-bound browser diagnostics
        if: ${{ always() && steps.browser_diagnostics.outputs.artifact_ready == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-diagnostics/artifact/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Retain synthetic duplicate review evidence
        if: ${{ always() && hashFiles('test-results/**/duplicate-counts.png', 'test-results/**/duplicate-comparison.png', 'test-results/**/duplicate-layout.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: duplicate-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/**/duplicate-counts.png
            test-results/**/duplicate-comparison.png
            test-results/**/duplicate-layout.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.required_jobs || '[]'), 'desktop') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - id: rust
        uses: dtolnay/rust-toolchain@stable
      # Compiled dependencies come from the most recent main build with the same
      # compiler and operating system. Only main writes this cache, so a pull request
      # can read it but never change what another run restores.
      - id: rust-cache
        name: Restore Rust dependencies compiled on main
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: rust-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-os/web build
      - name: Compile native overlay
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --no-bundle
      - name: Test native desktop contracts
        working-directory: apps/desktop
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -p tauri-plugin-updater --lib
      - name: Test macOS companion and compile WidgetKit extension
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          swift test --package-path macos
          bash macos/scripts/build-widgets.sh
          python3 -m unittest discover -s macos/scripts -p 'test_*.py'
      - name: Save Rust dependencies for later runs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  required:
    name: Source verification
    needs:
      - changes
      - infrastructure
      - repository
      - lint-and-format
      - quality
      - browser
      - desktop
    # A fast-lane draft run reports no aggregate. A classification that failed before
    # choosing a lane still does, and fails.
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { requiredGate } from "./.github/scripts/ci-scope.mjs";

          const needs = JSON.parse(process.env.NEEDS_JSON);
          const results = Object.fromEntries(
            Object.entries(needs).map(([name, job]) => [name, job.result]),
          );
          const scope = needs.changes?.outputs?.scope_json ?? "{}";
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Required CI result",
              "",
              "### Scope",
              "```json",
              scope,
              "```",
              "",
              "### Jobs",
              "```json",
              JSON.stringify(results, null, 2),
              "```",
              "",
            ].join("\n"),
          );
          if (!requiredGate(results, JSON.parse(scope))) {
            console.error("One or more required CI dependencies are missing or did not satisfy the selected scope.", results);
            process.exit(1);
          }
          NODE

      # The protected `CI required` gate lives in pr-metadata.yml. Starting it here,
      # once this run has a result, replaces a job that held a runner while polling.
      # The gate still observes this run through the API; nothing here vouches for it.
      - name: Start the metadata gate for this candidate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/start-metadata-gate.mjs
