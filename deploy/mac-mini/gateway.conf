# Only cloudflared shares the edge network with this listener. No host ports.
map $host $ilo_upstream {
  default "";
  nohmi.coopersully.me http://web:8080;
  nohmi-api.coopersully.me http://api:8787;
  nohmi-mcp.coopersully.me http://mcp:8788;
}

server {
  # Bind only the edge interface; peer origins cannot submit forged CF headers.
  listen 172.30.253.2:8080;
  server_name nohmi.coopersully.me nohmi-api.coopersully.me nohmi-mcp.coopersully.me;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  client_max_body_size 10m;
  # Avoid putting auth callback codes or query parameters into access logs.
  access_log off;
  error_log /dev/stderr crit;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  if ($ilo_upstream = "") { return 404; }

  location / {
    proxy_pass $ilo_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Replace client-supplied forwarding chains with Cloudflare's client address.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP "";
    proxy_hide_header Strict-Transport-Security;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
