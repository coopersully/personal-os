server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The HTTPS gateway owns the public origin; directory redirects stay relative.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health/live {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # iOS reads this to open record links in the app. Apple requires JSON served directly
  # (no redirect); the file has no extension, so its type is set here.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /skills/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
