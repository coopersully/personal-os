name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      repo: ${{ steps.scope.outputs.repo }}
      terraform: ${{ steps.scope.outputs.terraform }}
      node: ${{ steps.scope.outputs.node }}
      database: ${{ steps.scope.outputs.database }}
      browser: ${{ steps.scope.outputs.browser }}
      desktop: ${{ steps.scope.outputs.desktop }}
      containers: ${{ steps.scope.outputs.containers }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      changed_packages: ${{ steps.scope.outputs.changed_packages }}
      scope_json: ${{ steps.scope.outputs.scope_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify affected validation scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          scope_json="$RUNNER_TEMP/ci-scope.json"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" > "$changed_files"; then
              echo "Unable to calculate the pull-request diff; selecting full CI." >&2
              : > "$changed_files"
            fi
          else
            : > "$changed_files"
          fi
          node .github/scripts/ci-scope.mjs \
            --files "$changed_files" \
            --json \
            --github-output "$GITHUB_OUTPUT" | tee "$scope_json"
          {
            echo "## CI scope (shadow mode)"
            echo '```json'
            cat "$scope_json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Terraform
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  repository:
    name: Repository contracts
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.repo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm check:repo

  lint-and-format:
    name: Lint and format
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  quality:
    name: Node quality
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:node
      - run: pnpm audit --prod

  browser:
    name: Browser acceptance
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-os/web build
      - name: Compile native overlay
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --no-bundle

  required:
    name: CI required
    needs:
      - changes
      - infrastructure
      - repository
      - lint-and-format
      - quality
      - browser
      - desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { requiredGate } from "./.github/scripts/ci-scope.mjs";

          const needs = JSON.parse(process.env.NEEDS_JSON);
          const results = Object.fromEntries(
            Object.entries(needs).map(([name, job]) => [name, job.result]),
          );
          const scope = needs.changes?.outputs?.scope_json ?? "{}";
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Required CI result",
              "",
              "### Scope",
              "```json",
              scope,
              "```",
              "",
              "### Jobs",
              "```json",
              JSON.stringify(results, null, 2),
              "```",
              "",
            ].join("\n"),
          );
          if (!requiredGate(results)) {
            console.error("One or more required CI dependencies did not succeed or skip.", results);
            process.exit(1);
          }
          NODE
