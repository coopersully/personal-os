packages:
  - apps/*
  - packages/*

# Keep transitive runtime dependencies on patched releases until their parents
# publish dependency ranges that include the fixes.
overrides:
  "@modelcontextprotocol/node@2.1.0>@hono/node-server": "2.1.3"
  "@modelcontextprotocol/sdk@1.29.0>@hono/node-server": "2.1.3"
  "ajv@8.20.0>fast-uri": "3.1.4"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "glob@>=9.0.0 <14.0.2": "14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "11.0.1"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "follow-redirects@<1.16.2": "1.16.2"
  "hono@<4.13.13": "4.13.13"
  "html-to-text@10.0.0>deepmerge-ts": "8.0.1"
  "ip-address@>=10.0.0 <10.7.4": "10.7.4"
  "nodemailer@<10.1.4": "10.1.4"
  "postcss@8.5.17": "8.5.23"
  "proxy-addr@<2.0.8": "2.0.8"
  "qs": "6.16.1"
  "@modelcontextprotocol/client>zod": "4.6.6"
  "@modelcontextprotocol/core>zod": "4.6.6"
  "@modelcontextprotocol/server>zod": "4.6.6"

allowBuilds:
  '@biomejs/biome': true
  '@playwright/browser-chromium': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@playwright/browser-chromium'
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

# These declaration files import React types without declaring the peer. Keep
# their types bound to the consuming web app when Expo uses another React version.
packageExtensions:
  reicon-react:
    peerDependencies:
      '@types/react': '*'
  vaul:
    peerDependencies:
      '@types/react': '*'

# sonner-native 0.27 supplies web-only Reanimated dependencies on native.
# Preserve those arrays on web; native worklet closure tracking owns updates.
# Remove when upstream adopts the platform-specific hook contract.
patchedDependencies:
  sonner-native@0.27.0: patches/sonner-native@0.27.0.patch
