name: PR metadata

on:
  pull_request:
    types: [edited, opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate current Work map
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./.codex/scripts/check-pr-body.sh
      - name: Require successful source verification for this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/wait-source-ci.mjs
