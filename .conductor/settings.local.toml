"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Ports, URLs, and the Compose project name for this worktree, generated by
# .codex/scripts/environment.sh during setup. It holds only local ports and the
# dev-only Postgres credentials, so agents can reach the right local API without
# re-deriving the worktree port shift. The real .env is deliberately NOT listed
# here: it carries provider secrets that do not belong in the agent environment.
environment_variable_files = [ ".env.codex.local" ]

[scripts]
# The repository owns its own lifecycle in .codex/scripts/environment.sh, which
# installs locked dependencies, synchronizes .env from the primary checkout, and
# generates this worktree's port shift. Cloud sandboxes have no primary checkout
# and no Docker, so they get a plain dependency install instead.
setup = """
set -euo pipefail
if [ "${CONDUCTOR_IS_LOCAL:-1}" = "1" ]; then
  bash ./.codex/scripts/environment.sh setup
else
  pnpm install --frozen-lockfile
fi
"""

# Release this worktree's containers and ports before the workspace is archived.
# `stop` is the repository's non-destructive teardown: it stops the services and
# preserves the PostgreSQL volume.
archive = "bash ./.codex/scripts/environment.sh stop"

# Safe to run several workspaces at once: environment.sh derives a per-worktree
# port shift for web/API/MCP/PostgreSQL and an isolated COMPOSE_PROJECT_NAME, and
# Vite runs with --strictPort so any collision fails loudly instead of silently.
run_mode = "concurrent"

# Starting the full Docker stack on every new workspace is too heavy to be implicit.
auto_run_after_setup = false

# Starts PostgreSQL plus the API, MCP, and web source, then stays attached in one
# process group so failures remain visible. Prints the workspace's URLs on startup.
[scripts.run.dev]
command = "bash ./.codex/scripts/environment.sh start"
default = true
icon = "play"
available_in = [ "local" ]

# Docker-free, so it also works in cloud workspaces.
[scripts.run.check]
command = "pnpm lint && pnpm typecheck"
icon = "check"

# Watch loop. Local only: the *.integration.test.ts suites start testcontainers.
[scripts.run.test]
command = "pnpm exec vitest --watch"
icon = "test-tube"
available_in = [ "local" ]

# The pre-PR gate from AGENTS.md: mirror checks, lint, types, coverage, builds, E2E.
[scripts.run.verify]
command = "bash ./.codex/scripts/environment.sh verify"
icon = "shield-check"
available_in = [ "local" ]

[scripts.run.e2e]
command = "bash ./.codex/scripts/environment.sh e2e"
icon = "bug"
available_in = [ "local" ]

[scripts.run.status]
command = "bash ./.codex/scripts/environment.sh status"
icon = "activity"
available_in = [ "local" ]

[scripts.run.logs]
command = "bash ./.codex/scripts/environment.sh logs"
icon = "scroll-text"
available_in = [ "local" ]

# Conductor's stop button ends the attached process group but leaves this
# worktree's containers up; this frees them without touching the database volume.
[scripts.run.stop]
command = "bash ./.codex/scripts/environment.sh stop"
icon = "circle-stop"
available_in = [ "local" ]
