packages:
  - apps/*
  - packages/*

# Keep transitive runtime dependencies on patched releases until their parents
# publish dependency ranges that include the fixes.
overrides:
  "@modelcontextprotocol/sdk@1.29.0>@hono/node-server": "2.0.11"
  "ajv@8.20.0>fast-uri": "3.1.4"
  "brace-expansion@5.0.7": "5.0.8"
  "postcss@8.5.17": "8.5.23"

allowBuilds:
  '@biomejs/biome': true
  '@playwright/browser-chromium': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@playwright/browser-chromium'
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

# This advisory only affects React Router RSC server actions. ilo uses the
# client-side BrowserRouter, and the registry has no patched stable release.
auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
