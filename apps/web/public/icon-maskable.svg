<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Nomi</title>
  <desc>The Nomi mark inside the maskable safe zone on a full-bleed background.</desc>
  <!--
    Android crops a maskable icon to a circle, so the whole framed mark is scaled to 290px and
    centred, keeping it inside the safe zone (a square inscribed in the 80% safe circle measures
    512 * 0.8 / sqrt(2) ~= 290). The background bleeds to the edge so no crop shape shows corners.
  -->
  <rect width="512" height="512" fill="#000"/>
  <g transform="translate(111 111) scale(0.56640625)">
    <rect width="512" height="512" rx="116" fill="#000"/>
    <rect x="28" y="28" width="456" height="456" rx="92" fill="#fff"/>
